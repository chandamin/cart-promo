query CartInput($triggerCollectionIds: [ID!]) {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inTriggerCollection: inAnyCollection(ids: $triggerCollectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cartpromo", key: "free-gift-config") {
      value
    }
  }
}
