query CartInput($triggerCollectionIds: [ID!], $excludedCollectionIds: [ID!]) {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inTriggerCollection: inAnyCollection(ids: $triggerCollectionIds)
            inExcludedCollection: inAnyCollection(ids: $excludedCollectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cartpromo", key: "tiered-discount-config") {
      value
    }
  }
}
